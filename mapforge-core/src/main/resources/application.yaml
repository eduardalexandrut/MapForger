server:
  port: 8082

spring:
  application:
    name: mapforge-core

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true

eureka:
  client:
    register-with-eureka: true   # Registers this service with Eureka
    fetch-registry: false        # Core itself doesn’t need to fetch other services
    service-url:
      defaultZone: http://mapforge-eureka:8761/eureka/
