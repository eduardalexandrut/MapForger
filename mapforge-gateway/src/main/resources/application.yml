server:
  port: 8080

spring:
  application:
    name: mapforge-gateway

  cloud:
    gateway:
      routes:
        # WebSocket Route (must come before REST route)
        - id: gameplay-websocket
          uri: lb:ws://mapforge-gameplay
          predicates:
            - Path=/mapforge-gameplay/gameplay-ws/**

        # Gameplay REST Route
        - id: gameplay-rest
          uri: lb://mapforge-gameplay
          predicates:
            - Path=/mapforge-gameplay/**

        # Core REST Route
        - id: core-rest
          uri: lb://mapforge-core
          predicates:
            - Path=/mapforge-core/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://mapforge-eureka:8761/eureka/